# NED world / FRD chassis; continuous P1/R0 with four-point compliant landing gear.
schema_version = 3
model_name = "ConfiguredQuadP1"

[geometry]
preset = "QuadX"
nActuators = 4
actuatorIndex = [3, 2, 4, 1]
spinSign = [-1, 1, -1, 1]

[mass]
mode = "aggregate"
[mass.aggregate]
mass = 1.5
inertia = [[0.02, 0.0, 0.0], [0.0, 0.02, 0.0], [0.0, 0.0, 0.04]]

[motor]
Kv = 62.5 # (rad/s)/V; 1000 rad/s at 16 V and full modulation
tauOmega = 0.03
kT = 0.00001
kQ = 0.00000015

[initial]
p_start = [0.0, 0.0, -0.12] # Feet start 2 cm above the ground.
q_start = [0.7071067811865476, 0.0, 0.0, 0.7071067811865476]

[landing_gear]
enabled = true
groundZ = 0.0
stiffness = 3000.0
damping = 150.0
tangentialDamping = 25.0
frictionCoefficient = 0.6

[models]
rotor = "voltage_driven"

[power]
dcVoltage = 16.0 # Ideal fixed supply; no battery current/SOC model.

# Shared VirtualIO PWM calibration for both P0 and P1.
[interface]
pwm_min = 1100.0
pwm_max = 1900.0
